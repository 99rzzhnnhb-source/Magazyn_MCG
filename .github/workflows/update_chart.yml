name: Update Warehouse Chart

on:
  push:
    paths:
      - 'magazyn.csv'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # Zaktualizowano z v3 na v4

      - name: Set up Python
        uses: actions/setup-python@v5  # Zaktualizowano z v4 na v5
        with:
          python-version: '3.11'  # Używamy nowszej, stabilnej wersji Pythona

      - name: Install dependencies
        run: pip install pandas matplotlib

      - name: Generate Chart
        run: python generate_chart.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add wykres_zajetosci.png
          git commit -m "Automatyczna aktualizacja wykresu" || exit 0
          git push
